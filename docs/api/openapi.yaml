  /api/payment-card:
    get:
      tags:
        - PaymentCard
      summary: Obtener mi tarjeta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Tarjeta enmascarada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCardResponse'
        '401':
          description: No autorizado.
        '404':
          description: El usuario no tiene tarjeta registrada.
    post:
      tags:
        - PaymentCard
      summary: Registrar mi tarjeta
      description: Cada usuario solo puede tener una tarjeta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCardRequest'
      responses:
        '201':
          description: Tarjeta registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCardResponse'
        '400':
          description: Datos inválidos (número, CVV, fecha o tarjeta caducada).
        '401':
          description: No autorizado.
        '409':
          description: El usuario ya tiene una tarjeta registrada.
    put:
      tags:
        - PaymentCard
      summary: Editar mi tarjeta
      description: Como no se guarda el número ni el CVV, hay que enviar todos los datos de nuevo.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCardRequest'
      responses:
        '200':
          description: Tarjeta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCardResponse'
        '400':
          description: Datos inválidos.
        '401':
          description: No autorizado.
        '404':
          description: El usuario no tiene tarjeta registrada.
    delete:
      tags:
        - PaymentCard
      summary: Borrar mi tarjeta
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Tarjeta borrada.
        '401':
          description: No autorizado.
        '404':
          description: El usuario no tiene tarjeta registrada.

  /api/wallet/balance:
    get:
      tags:
        - Wallet
      summary: Consultar mi saldo
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '401':
          description: No autorizado.

  /api/wallet/top-up:
    post:
      tags:
        - Wallet
      summary: Recargar saldo
      description: Requiere tener una tarjeta registrada. El cobro es simulado.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopUpRequest'
      responses:
        '201':
          description: Recarga realizada. Devuelve el movimiento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionResponse'
        '400':
          description: Importe no válido (menor o igual que 0, o superior a 1000 €).
        '401':
          description: No autorizado.
        '404':
          description: El usuario no tiene tarjeta registrada.

  /api/wallet/transactions:
    get:
      tags:
        - Wallet
      summary: Historial de movimientos de saldo
      description: Ordenado del más reciente al más antiguo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de movimientos (vacío si no hay ninguno).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletTransactionResponse'
        '401':
          description: No autorizado.
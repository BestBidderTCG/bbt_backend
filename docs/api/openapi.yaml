openapi: 3.0.3

info:
  title: BestBidder TCG API
  version: 0.2.0
  description: Contrato de la API de BestBidder TCG.

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Pega aquí el Access Token"

  schemas:
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: "Puede ser el email o el username"
          example: "david@test.com"
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: "david@test.com"
        username:
          type: string
          description: "Minúsculas, entre 3 y 50 chars, al menos una letra (ej: david.99)"
          example: "david_85"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 50
          example: "secreto85"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "97aee725-e493-4603-9b8f-d9fc87af37bb"
        email:
          type: string
          example: "david@test.com"
        username:
          type: string
          example: "david_85"
        description:
          type: string
          nullable: true
        avatarNum:
          type: integer
          nullable: false
          example: 1
        createdAt:
          type: string
          format: date-time

    PublicUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        description:
          type: string
          nullable: true
        avatarNum:
          type: integer
          nullable: true

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    UpdateUserProfileRequest:
      type: object
      properties:
        description:
          type: string
        avatarNum:
          type: integer

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 50

    ExistsResponse:
       type: object
       properties:
          exists:
            type: boolean
            example: false

    DeletionStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ ACTIVE, PENDING_DELETION, DELETED ]
          example: "PENDING_DELETION"
        deletionRequestedAt:
          type: string
          format: date-time
          nullable: true
          example: "2023-11-16T10:00:00Z"
        scheduledPurgeAt:
          type: string
          format: date-time
          nullable: true
          example: "2023-12-01T10:00:00Z"

    AccountDeletionCheckResponse:
      type: object
      required:
          - hasActiveAuction
          - isWinningAuction
      properties:
          hasActiveAuction:
            type: boolean
            description: Indica si el usuario tiene subastas como creador.
            example: true
          isWinningAuction:
            type: boolean
            description: Indica si el usuario es el mayor pujador en alguna subasta activa.
            example: false


    AuctionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        creatorId:
          type: string
          format: uuid
        creatorUsername:
          type: string
          example: "paula"
        card:
          $ref: '#/components/schemas/CardResponse'
        description:
          type: string
          nullable: true
          example: "Carta en perfecto estado, funda incluida."
        minPrize:
          type: number
          format: double
          example: 80.0
        startedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        durationInDays:
          type: integer
          example: 3
        status:
          type: string
          enum: [UPCOMING, IN_PROGRESS, FINISHED, CANCELLED]
          example: "IN_PROGRESS"

    CreateAuctionRequest:
      type: object
      required:
        - creator_id
        - creator_username
        - card_id
        - min_prize
        - started_at
        - duration_in_days
      properties:
        creator_id:
          type: string
          format: uuid
        creator_username:
          type: string
          example: "paula"
        card_id:
          type: string
          format: uuid
        description:
          type: string
          nullable: true
        min_prize:
          type: number
          format: double
          example: 80.0
        started_at:
          type: string
          format: date-time
        duration_in_days:
          type: integer
          minimum: 1
          maximum: 7
          example: 3

    AuctionListItemResponse:
      type: object
      description: Resumen de una subasta para el listado principal.
      properties:
        id:
          type: string
          format: uuid
        cardName:
          type: string
          example: "Charizard Base Set"
        cardImage:
          type: string
          example: "/uploads/charizard.png"
        currentBid:
          type: number
          format: double
          description: Importe de la última puja, o el precio mínimo si aún no hay pujas.
          example: 650.0
        remainingDays:
          type: integer
          minimum: 0
          maximum: 7
          description: Días restantes (redondeado hacia arriba).
          example: 3
        cardState:
          type: string
          enum: [NEW, NEAR_MINT, GOOD, LIGHT_PLAYED, POOR]
          example: "NEAR_MINT"
        cardCategory:
          type: string
          example: "Pokémon"
        cardCollection:
          type: string
          nullable: true
          example: "Base Set 1999"
        
    UserAuctionSummaryResponse:
      type: object
      description: Resumen de una subasta del usuario autenticado (incluye finalizadas).
      properties:
        id:
          type: string
          format: uuid
        cardName:
          type: string
          example: "Charizard Base Set"
        cardImage:
          type: string
          example: "/uploads/charizard.png"
        status:
          type: string
          enum: [UPCOMING, IN_PROGRESS, FINISHED]
          description: Estado calculado a partir de las fechas de inicio y fin.
          example: "FINISHED"
        minPrize:
          type: number
          format: double
          example: 80.0
        currentBid:
          type: number
          format: double
          description: Importe de la puja más alta, o el precio mínimo si no hay pujas.
          example: 650.0
        startedAt:
          type: integer
          format: int64
          description: Fecha de inicio en milisegundos desde epoch.
          example: 1700000000000
        endsAt:
          type: integer
          format: int64
          description: Fecha de fin en milisegundos desde epoch.
          example: 1700259200000
        winnerUsername:
          type: string
          nullable: true
          description: Username del ganador. Solo se informa si la subasta ha finalizado y tiene pujas.
          example: "user1"

    AuctionCreatorResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: "paula"
        avatarNum:
          type: integer
          nullable: true
          example: 3

    AuctionDetailResponse:
      type: object
      description: Detalle completo de una subasta.
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [UPCOMING, IN_PROGRESS, FINISHED, CANCELLED]
          example: "IN_PROGRESS"
        cardName:
          type: string
          example: "Charizard Base Set"
        cardImage:
          type: string
          example: "/uploads/charizard.png"
        cardCollection:
          type: string
          nullable: true
          example: "Base Set 1999"
        cardNumber:
          type: integer
          nullable: true
          example: 4
        cardState:
          type: string
          enum: [NEW, NEAR_MINT, GOOD, LIGHT_PLAYED, POOR]
          example: "NEAR_MINT"
        minPrize:
          type: number
          format: double
          example: 80.0
        increment:
          type: number
          format: double
          description: |
            Incremento aplicable según la última puja o, si no hay pujas, según el precio mínimo.
            La primera puja válida es el propio precio mínimo (sin sumar incremento).
          example: 5.0
        lastBid:
          type: number
          format: double
          nullable: true
          description: Importe de la última puja. Null si aún no hay pujas.
          example: 120.0
        bidCount:
          type: integer
          format: int64
          example: 3
        startedAt:
          type: integer
          format: int64
          description: Fecha de inicio en milisegundos desde epoch.
          example: 1700000000000
        endsAt:
          type: integer
          format: int64
          description: Fecha de fin en milisegundos desde epoch.
          example: 1700259200000
        description:
          type: string
          nullable: true
          example: "Carta en perfecto estado, funda incluida."
        creator:
          allOf:
            - $ref: '#/components/schemas/AuctionCreatorResponse'
          nullable: true
          description: Datos del creador. Null si quien consulta es el propietario de la subasta.
        isFavorite:
          type: boolean
          nullable: true
          description: |
            Si la subasta está en favoritos del usuario autenticado.
            Null si quien consulta es el propietario o no está autenticado.

    CreateCardRequest:
      type: object
      required:
        - name
        - category
        - state
      properties:
        name:
          type: string
          example: "Charizard Base Set"
        category:
          type: string
          example: "Pokemon"
        collection:
          type: string
          nullable: true
          example: "Pokemon 151"
        num:
          type: integer
          nullable: true
          example: 4
        state:
          type: string
          enum: [ NEW, NEAR_MINT, GOOD, LIGHT_PLAYED, POOR ]
          example: "NEAR_MINT"
        description:
          type: string
          nullable: true
          example: "Primera edición en funda protectora."

    UpdateCardRequest:
        type: object
        properties:
          name:
            type: string
            example: "Charizard Base Set Editado"
          category:
            type: string
            example: "Pokemon"
          collection:
            type: string
            nullable: true
            example: "Pokemon 151"
          num:
            type: integer
            nullable: true
            example: 4
          state:
            type: string
            enum: [ NEW, NEAR_MINT, GOOD, LIGHT_PLAYED, POOR ]
            example: "NEAR_MINT"
          description:
            type: string
            nullable: true
            example: "Descripción actualizada"

    CardSummaryResponse:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
            example: "Charizard Base Set"
          category:
            type: string
            example: "Pokemon"
          image:
            type: string
            example: "/uploads/imagen.png"

    CatalogResponse:
        type: object
        additionalProperties:
          type: array
          items:
            type: string
        example:
          Pokemon:
            - "Destinos de paldea"
            - "Brecha Paradojica"
            - "Pokemon 151"
          Magic:
            - "Alpha / Beta / Unlimited (1993)"

    CardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        name:
          type: string
          example: "Charizard Base Set"
        image:
          type: string
          example: "https://example.com/charizard.png"
        category:
          type: string
          example: "Pokémon"
        collection:
          type: string
          nullable: true
          example: "Base Set 1999"
        num:
          type: string
          nullable: true
          example: "4/102"
        state:
          type: string
          enum: [NEW, NEAR_MINT, GOOD, LIGHT_PLAYED, POOR]
          example: "NEAR_MINT"
        description:
          type: string
          nullable: true

    PlaceBidRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          example: 95.0

    BidResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        auctionId:
          type: string
          format: uuid
        bidderId:
          type: string
          format: uuid
        bidderUsername:
          type: string
          example: "david_85"
        amount:
          type: number
          format: double
          example: 95.0
        createdAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "Mensaje descriptivo del error"

paths:
  /api/health:
    get:
      summary: Comprobar el estado del servidor
      responses:
        '200':
          description: El servidor funciona correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
  

  /api/auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: Devuelve tokens (access + refresh) para evitar una llamada extra a /login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos inválidos (email/username con formato incorrecto o contraseña fuera del rango 6-50).
        '409':
          description: El email o el username ya existen.

  /api/auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales incorrectas.

  /api/auth/refresh:
    post:
      summary: Renovar Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens renovados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token inválido.

  /api/auth/logout:
    post:
      summary: Cerrar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada correctamente.

  /api/users/me:
    get:
      summary: Obtener mi perfil
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Perfil obtenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: No autorizado.
    patch:
      summary: Editar mi perfil
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos.
        '401':
          description: No autorizado.

    delete:
      summary: Solicitar eliminación de cuenta
      description: |
        Inicia el proceso de baja con un periodo de gracia de 15 días. 
        Bloquea la operación con un error 409 si el usuario tiene subastas activas/pendientes o si es el mayor pujador de una subasta en curso.
        Al solicitar la baja, se revocan todos los refresh tokens.
      security:
        - bearerAuth: [ ]
      responses:
        '202':
          description: Solicitud de eliminación aceptada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionStatusResponse'
        '401':
          description: No autorizado.
        '409':
          description: No se puede eliminar la cuenta porque tiene subastas activas o pujas ganadoras.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{id}:
    get:
      summary: Obtener perfil público de otro usuario
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Perfil público.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '401':
          description: No autorizado.
        '404':
          description: Usuario no encontrado.

  /api/users/me/password:
    patch:
      summary: Cambiar contraseña
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña cambiada correctamente.
        '400':
          description: Nueva contraseña inválida.
        '401':
          description: Contraseña actual incorrecta o no autorizado.

  /api/users/me/cancel-deletion:
    post:
      summary: Cancelar la eliminación de cuenta
      description: Cancela el proceso de baja si el usuario se arrepiente. (Hacer login también cancela la baja).
      security:
        - bearerAuth: [ ]
      responses:
        '204':
          description: Eliminación cancelada correctamente. La cuenta vuelve a estado ACTIVE.
        '401':
          description: No autorizado.

  /api/users/me/deletion-status:
      get:
        summary: Consultar estado de eliminación de la cuenta
        description: Devuelve si la cuenta está activa, pendiente de borrado (con su fecha límite) o si ya ha sido purgada.
        security:
          - bearerAuth: [ ]
        responses:
          '200':
            description: Estado obtenido correctamente.
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/DeletionStatusResponse'
          '401':
            description: No autorizado.

  /api/users/me/deletion-check:
      get:
        summary: Comprobar las condiciones para eliminar la cuenta
        description: Devuelve dos booleanos indicando si el usuario tiene subastas como creador o es el mayor pujador en una subasta activa.
        security:
            - bearerAuth: [ ]
        responses:
            '200':
              description: Resultado de la comprobación.
              content:
                application/json:
                  schema:
                    $ref: '#/components/schemas/AccountDeletionCheckResponse'
            '401':
              description: No autorizado.


  /api/auth/check-email:
    get:
      summary: Comprobar si un email ya está registrado
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Resultado de la comprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResponse'

  /api/auth/check-username:
    get:
      summary: Comprobar si un username ya está en uso
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultado de la comprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResponse'
  
  

  /api/auction/all:
    get:
      summary: Obtener el listado de subastas en curso
      description: |
        Devuelve un resumen de las subastas no canceladas y no finalizadas, ordenadas según el parámetro `sort`.
        El filtrado se realiza en el cliente; el backend solo gestiona la ordenación.
      parameters:
        - name: sort
          in: query
          required: false
          description: |
            Criterio de ordenación:
            - ENDING_SOON: las que terminan antes primero
            - ENDING_LATE: las que terminan más tarde primero
            - RECENT_FIRST: las subastas que empezaron más recientemente (SOLO VÁLIDA PARA ACTIVAS)
            - OLDEST_FIRST: las subastas que empezaron hace más tiempo (SOLO VÁLIDA PARA ACTIVAS)
            - PRICE_ASC / PRICE_DESC: puja actual de menor a mayor / de mayor a menor
            - NAME_ASC / NAME_DESC: nombre de la carta de A a Z / de Z a A
            - NUMBER_ASC / NUMBER_DESC: número de carta ascendente / descendente (las cartas sin número van siempre al final)
          schema:
            type: string
            enum: [ENDING_SOON, ENDING_LATE, PRICE_ASC, PRICE_DESC, NAME_ASC, NAME_DESC, NUMBER_ASC, NUMBER_DESC]
            default: ENDING_SOON
      responses:
        '200':
          description: Listado de subastas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuctionSummaryResponse'
        '400':
          description: Valor de `sort` no válido.

  /api/auction/user/my-auctions:
    get:
      tags:
        - Auction
      summary: Listar mis subastas
      description: |
        Devuelve las subastas creadas por el usuario autenticado, ordenadas por fecha de fin descendente.
        Incluye las pendientes de comenzar, en curso y finalizadas. Excluye las canceladas.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de subastas del usuario (vacío si no tiene ninguna).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserAuctionSummaryResponse'
        '401':
          description: No autenticado o token inválido

  /api/auction/{id}:
    get:
      tags:
        - Auction
      summary: Obtener el detalle de una subasta por su ID
      description: |
        Endpoint público. Si se envía un token válido, la respuesta se adapta a quien consulta:

        | Quién consulta | `creator` | `isFavorite` |
        |---|---|---|
        | El propietario | `null` | `null` |
        | Otro usuario autenticado | datos del creador | `true` / `false` |
        | Sin autenticar | datos del creador | `null` |
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la subasta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionDetailResponse'
        '404':
          description: Subasta no encontrada.

  /api/auction/create:
    post:
      summary: Crear una nueva subasta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuctionRequest'
      responses:
        '201':
          description: Subasta creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionResponse'
        '400':
          description: Datos inválidos o ya existe una subasta activa para esa carta.
        '401':
          description: No autorizado.
  
  /api/card/catalog:
    get:
      summary: Obtener el catálogo estático de categorías y colecciones
      responses:
        '200':
          description: Catálogo obtenido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'

  /api/card/create:
    post:
      summary: Crear y registrar una nueva carta
      description: Asigna automáticamente la propiedad al usuario autenticado mediante el token JWT.
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/CreateCardRequest'
                image:
                  type: string
                  format: binary
                  description: Archivo de la imagen de la carta.
      responses:
        '201':
          description: Carta creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: Datos de la carta inválidos o categoría no permitida.
        '401':
          description: No autorizado.

  /api/card/all:
    get:
      summary: Obtener todas las cartas registradas en el sistema
      responses:
        '200':
          description: Listado completo de cartas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardResponse'

  /api/card/user/my-cards:
    get:
      summary: Obtener el resumen de las cartas del usuario autenticado
      description: Devuelve solo id, nombre, categoría e imagen (optimizado para listados).
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Listado de cartas pertenecientes al usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardSummaryResponse'
        '401':
          description: No autorizado.

  /api/card/{id}:
    get:
      summary: Obtener detalle completo de una carta por su ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Carta encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: No existe ninguna carta con ese ID.

    put:
      summary: Editar una carta existente
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/UpdateCardRequest'
                image:
                  type: string
                  format: binary
                  description: (Opcional) Nueva imagen para la carta.
      responses:
        '200':
          description: Carta actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: Datos inválidos, categoría no permitida o carta no encontrada.
        '401':
          description: No autorizado.
        '403':
          description: No tienes permiso para editar esta carta.

    delete:
      summary: Eliminar una carta
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Carta eliminada correctamente.
        '400':
          description: Carta no encontrada.
        '401':
          description: No autorizado.
        '403':
          description: No tienes permiso para borrar esta carta.

  /api/bid/{auctionId}:
    post:
      summary: Realizar una puja en una subasta
      description: Registra una puja del usuario autenticado sobre la subasta indicada.
      security:
        - bearerAuth: []
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
      responses:
        '201':
          description: Puja registrada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidResponse'
        '400':
          description: Importe insuficiente, subasta inactiva o el pujador es el creador.
        '401':
          description: No autorizado.

  /api/bid/history/{auctionId}:
    get:
      summary: Obtener historial de pujas de una subasta
      parameters:
        - name: auctionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Listado ordenado de pujas de la subasta.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BidResponse'
  
  /api/auction/{id}/favorite:
    post:
      tags:
        - Auction
      summary: Añadir una subasta a favoritos
      description: Marca una subasta como favorita para el usuario autenticado. Es idempotente y no permite guardar subastas propias.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID de la subasta
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Subasta añadida a favoritos correctamente
        '400':
          description: Subasta inexistente o intento de añadir una subasta propia a favoritos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Acceso denegado

    delete:
      tags:
        - Auction
      summary: Eliminar una subasta de favoritos
      description: Elimina la subasta de la lista de favoritos del usuario autenticado.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID de la subasta
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Subasta eliminada de favoritos correctamente
        '401':
          description: No autenticado o token inválido
        '403':
          description: Acceso denegado

  /api/auction/favorites:
    get:
      tags:
        - Auction
      summary: Listar subastas favoritas del usuario
      description: Devuelve todas las subastas marcadas como favoritas por el usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de subastas favoritas obtenido correctamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuctionResponse'
        '401':
          description: No autenticado o token inválido
        '403':
          description: Acceso denegado
                  $ref: '#/components/schemas/AuctionListItemResponse'
        '401':
          description: No autorizado.

  /api/auction/{id}:
    get:
      tags:
        - Auction
      summary: Obtener el detalle de una subasta por su ID
      description: |
        Endpoint público. Si se envía un token válido, la respuesta se adapta a quien consulta:

        | Quién consulta | `creator` | `isFavorite` |
        |---|---|---|
        | El propietario | `null` | `null` |
        | Otro usuario autenticado | datos del creador | `true` / `false` |
        | Sin autenticar | datos del creador | `null` |
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la subasta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionDetailResponse'
        '404':
          description: Subasta no encontrada.
    patch:
      tags:
        - Auction
      summary: Editar una subasta pendiente de iniciar
      description: |
        Permite al creador de una subasta modificar sus datos siempre que la subasta aún no haya comenzado (`startedAt` en el futuro).
        Solo se actualizan los campos enviados en el cuerpo de la petición.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAuctionRequest'
      responses:
        '200':
          description: Subasta actualizada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionResponse'
        '400':
          description: Datos inválidos, subasta no encontrada o el usuario no es el creador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autorizado.
        '409':
          description: La subasta ya ha comenzado y no se puede editar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Auction
      summary: Cancelar o eliminar una subasta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Subasta cancelada correctamente.
        '400':
          description: Operación no permitida o subasta inexistente.
        '401':
          description: No autorizado.


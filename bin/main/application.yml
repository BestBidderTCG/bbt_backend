spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/bestbidder
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Esto crea las tablas automáticamente los @Entity
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
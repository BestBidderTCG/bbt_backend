  /api/auction/{id}/bid:
    post:
      tags:
        - Bid
      summary: Realizar una puja en una subasta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
      responses:
        '201':
          description: Puja registrada correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidResponse'
        '400':
          description: Importe inferior al mínimo, subasta no activa, el creador no puede pujar o ya tienes la puja más alta.
        '401':
          description: No autorizado.
        '409':
          description: |
            Conflicto. Dos casos:
            - Saldo insuficiente para pujar.
            - Puja desactualizada: alguien ha pujado igual o más mientras el usuario estaba en la pantalla.
              El mensaje incluye el nuevo mínimo para pujar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


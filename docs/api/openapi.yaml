openapi: 3.0.3

info:
  title: BestBidder TCG API
  version: 0.2.0
  description: Contrato de la API de BestBidder TCG.

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Pega aquí el Access Token"

  schemas:
    LoginRequest:
      type: object
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          description: "Puede ser el email o el username"
          example: "david@test.com"
        password:
          type: string
          format: password

    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: "david@test.com"
        username:
          type: string
          description: "Minúsculas, entre 3 y 50 chars, al menos una letra (ej: david.99)"
          example: "david_85"
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 50
          example: "secreto85"

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "97aee725-e493-4603-9b8f-d9fc87af37bb"
        email:
          type: string
          example: "david@test.com"
        username:
          type: string
          example: "david_85"
        description:
          type: string
          nullable: true
        avatarNum:
          type: integer
          nullable: true
          example: 1
        createdAt:
          type: string
          format: date-time

    PublicUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        description:
          type: string
          nullable: true
        avatarNum:
          type: integer
          nullable: true

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'

    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    UpdateUserProfileRequest:
      type: object
      properties:
        description:
          type: string
        avatarNum:
          type: integer

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 50

    ExistsResponse:
       type: object
       properties:
          exists:
            type: boolean
            example: false

paths:
  /api/health:
    get:
      summary: Comprobar el estado del servidor
      responses:
        '200':
          description: El servidor funciona correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK

  /api/auth/register:
    post:
      summary: Registrar un nuevo usuario
      description: Devuelve tokens (access + refresh) para evitar una llamada extra a /login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuario registrado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Datos inválidos (email/username con formato incorrecto o contraseña fuera del rango 6-50).
        '409':
          description: El email o el username ya existen.

  /api/auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales incorrectas.

  /api/auth/refresh:
    post:
      summary: Renovar Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens renovados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Refresh token inválido.

  /api/auth/logout:
    post:
      summary: Cerrar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sesión cerrada correctamente.

  /api/users/me:
    get:
      summary: Obtener mi perfil
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Perfil obtenido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: No autorizado.
    patch:
      summary: Editar mi perfil
      security:
        - bearerAuth: [ ]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Datos inválidos.
        '401':
          description: No autorizado.

  /api/users/{id}:
    get:
      summary: Obtener perfil público de otro usuario
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Perfil público.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserResponse'
        '401':
          description: No autorizado.
        '404':
          description: Usuario no encontrado.

  /api/users/me/password:
    patch:
      summary: Cambiar contraseña
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Contraseña cambiada correctamente.
        '400':
          description: Nueva contraseña inválida.
        '401':
          description: Contraseña actual incorrecta o no autorizado.


  /api/auth/check-email:
    get:
      summary: Comprobar si un email ya está registrado
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Resultado de la comprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResponse'

  /api/auth/check-username:
    get:
      summary: Comprobar si un username ya está en uso
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultado de la comprobación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExistsResponse'
name: Kotlin Backend CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java 17 (versión que usa tu proyecto)
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Dar permisos de ejecución al wrapper de Gradle
      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      # 4. Pasar verificación de formato/linter (si usas el plugin de ktlint)
      - name: Verificar formato de código (Ktlint)
        run: ./gradlew ktlintCheck
        continue-on-error: false # Cambia a true si no quieres que aborte la CI si falla el formato

      # 5. Ejecutar la tarea check (incluye tests unitarios y validaciones)
      - name: Ejecutar pruebas y compilación (check)
        run: ./gradlew check

      # 6. (Opcional) Compilar el artefacto para asegurar que build no rompe
      - name: Compilar proyecto
        run: ./gradlew build -x test
  /api/card/create:
    post:
      tags:
        - Card
      summary: Crear y registrar una nueva carta
      description: Asigna automáticamente la propiedad al usuario autenticado mediante el token JWT y sube la imagen a Cloudinary.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - data
                - image
              properties:
                data:
                  $ref: '#/components/schemas/CreateCardRequest'
                image:
                  type: string
                  format: binary
                  description: Archivo de la imagen de la carta.
      responses:
        '201':
          description: Carta creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardResponse'
        '400':
          description: Datos inválidos o combinación categoría/colección no permitida en el catálogo.
        '401':
          description: No autorizado.

  /api/card/{id}:
    get:
